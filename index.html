<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Plano de Cutting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de uma coluna para celular — cabeçalho fixo com tipo de dia, conteúdo rolável, navegação inferior por abas */
:root{
  --bg:#eef2f1;
  --surface:#ffffff;
  --surface-2:#f6f8f7;
  --ink:#15211e;
  --muted:#5b6965;
  --line:#d9e1de;
  --accent:#0d7a64;
  --accent-soft:#d6efe8;
  --food:#b0522b;
  --food-soft:#f6e3d9;
  --ok:#2c8a4b;
  --warn:#a86b12;
  --display:"Outfit", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1413; --surface:#172020; --surface-2:#1d2726; --ink:#e6eeeb; --muted:#9caba7;
    --line:#2b3735; --accent:#3cb89c; --accent-soft:#16332c; --food:#e38c62; --food-soft:#3a251b;
    --ok:#5fc27f; --warn:#e0a54a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1413; --surface:#172020; --surface-2:#1d2726; --ink:#e6eeeb; --muted:#9caba7;
  --line:#2b3735; --accent:#3cb89c; --accent-soft:#16332c; --food:#e38c62; --food-soft:#3a251b;
  --ok:#5fc27f; --warn:#e0a54a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:20px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.date{color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
main{flex:1;overflow-y:auto;padding:14px 16px 150px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
main>*{flex-shrink:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:560px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a[aria-current="page"]{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.food{background:var(--food-soft);color:var(--food);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}

.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .big{font-family:var(--display);font-size:24px;font-weight:700}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.food i{background:var(--food)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}

.meal{border-left:4px solid var(--food)}
.meal.isdone{border-left-color:var(--ok);opacity:.85}
.mtime{font-family:var(--display);font-weight:600;color:var(--food);font-size:14px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.qty{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}

.water{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.water button{width:100%;height:42px;border-radius:8px 8px 12px 12px;border:1.5px solid var(--accent);background:transparent;padding:0}
.water button.on{background:var(--accent)}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sec-h{width:100%;border:0;background:transparent;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sec-h .ic{font-family:var(--display);font-size:22px;line-height:1;color:var(--muted);flex-shrink:0}
.sec .body{padding:0 14px 14px;display:none;flex-direction:column;gap:8px}
.sec.open .body{display:flex}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.opt b{font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.chips button b{font-family:var(--display);font-size:20px}
.chips button span{font-size:11px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips button[aria-pressed="true"] span{color:#fff;opacity:.85}
.ex{border-left:4px solid var(--accent)}
.ex.bi{border-left-style:dashed}
.exn{display:flex;gap:10px;align-items:flex-start}
.exn .k{font-family:var(--display);font-weight:700;color:var(--accent);min-width:24px}
.sets{display:flex;gap:6px;flex-wrap:wrap}
.sets button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700}
.sets button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.load{display:flex;align-items:center;gap:6px}
.load input{width:72px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:right}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.subs button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px}
.subs button.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.timer{position:fixed;left:0;right:0;bottom:64px;display:none;justify-content:center;z-index:19;padding:0 12px}
.timer.show{display:flex}
.timer .in{width:100%;max-width:536px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .t{font-family:var(--display);font-size:28px;font-weight:700;min-width:80px}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:5px 9px;font-weight:700;font-size:13px}
.timer.end .in{background:var(--ok);color:#fff}

.zone{display:flex;height:34px;border-radius:8px;overflow:hidden;font-size:11px;font-weight:700}
.zone div{display:flex;align-items:center;justify-content:center;color:#fff}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week div{border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;display:flex;flex-direction:column;gap:3px;min-height:74px}
.week div.today{border-color:var(--accent);border-width:2px}
.week b{font-family:var(--display);font-size:12px}
.week .m{background:var(--accent);color:#fff;border-radius:5px;padding:2px 0;font-weight:700}
.week .c{background:var(--food-soft);color:var(--food);border-radius:5px;padding:2px 0;font-weight:700}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.note{border-left:3px solid var(--warn);padding:6px 10px;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:13.5px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.mode button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.items{display:flex;flex-direction:column;background:var(--surface-2);border-radius:10px;padding:4px 10px}
.it{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.it:last-child{border-bottom:0}
.it .nm{flex:1;min-width:0}
.it .q{color:var(--muted);white-space:nowrap}
.it .kc{color:var(--muted);font-size:12.5px;min-width:44px;text-align:right;white-space:nowrap}
.qin{display:flex;align-items:center;gap:3px}
.qin input{width:64px;padding:6px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right;font-size:14px}
.qin .u{font-size:12px;color:var(--muted);width:18px}
.rm{border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:2px 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.fld input,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);font-family:var(--body)}
.col{display:flex;flex-direction:column;gap:8px}
.seg3{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg3 button{border:0;background:transparent;border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile.good{border-left-color:var(--ok)} .tile.warn{border-left-color:var(--warn)}
.tile .tv{font-family:var(--display);font-size:22px;font-weight:700}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.chart .tgt{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
.chart .tk{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .b.food{fill:var(--food)} .chart .b.acc{fill:var(--accent)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.tip{min-height:18px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow"><h1>Meu plano</h1><span class="date num" id="today"></span></div>
    <div class="seg" role="group" aria-label="Tipo de dia">
      <button id="d-casa" data-day="casa">Em casa</button>
      <button id="d-p12" data-day="p12">Plantão 12 h</button>
      <button id="d-p24" data-day="p24">Plantão 24 h</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="timer" id="timer"><div class="in">
  <span class="small">Descanso</span><span class="t num" id="tval">0:00</span>
  <span style="flex:1"></span>
  <button id="tminus">−15</button><button id="tplus">+15</button><button id="tstop">Parar</button>
</div></div>
<nav class="tabs"><div class="in">
  <a href="#hoje" data-tab="hoje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Hoje</a>
  <a href="#refeicoes" data-tab="refeicoes"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8M7 7h4M17 3c-2 2-2 6 0 8v10"/></svg>Refeições</a>
  <a href="#treino" data-tab="treino"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Treino</a>
  <a href="#cardio" data-tab="cardio"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Cardio</a>
  <a href="#analise" data-tab="analise"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análise</a>
  <a href="#dicas" data-tab="dicas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11v1h6v-1a6 6 0 0 0-3-11z"/></svg>Dicas</a>
</div></nav>

<script>
/* ---------- armazenamento local (opcional) ---------- */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? (k in mem ? mem[k] : d) : JSON.parse(v); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const now = new Date();
const dkey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
document.getElementById('today').textContent = DIAS[now.getDay()]+', '+now.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
let day = store.get('dayType','casa');
const dayData = () => { const o = store.get('d:'+dkey, null) || {done:{}, choice:{}, water:0, sets:{}, act:{}}; o.done=o.done||{}; o.choice=o.choice||{}; o.sets=o.sets||{}; o.act=o.act||{}; o.water=o.water||0; return o; };
const saveDay = (o) => store.set('d:'+dkey, o);

/* ---------- base de alimentos (por 100 g/ml, ou por unidade quando u='un') ---------- */
const FD = {
 flocao:{t:'Flocão de milho (cru)',k:360,p:7,u:'g'}, pao_int:{t:'Pão de forma integral',k:250,p:12,u:'g'},
 pao_fr:{t:'Pão francês',k:300,p:8,u:'g'}, goma:{t:'Goma de tapioca',k:240,p:0,u:'g'},
 aveia:{t:'Aveia em flocos',k:394,p:14,u:'g'}, wrap:{t:'Wrap integral (40 g)',k:120,p:4,u:'un'},
 torrada:{t:'Torrada integral',k:40,p:1.3,u:'un'},
 ovo:{t:'Ovo inteiro',k:72,p:6.5,u:'un'}, clara:{t:'Clara de ovo',k:17,p:3.6,u:'un'},
 cottage:{t:'Queijo cottage',k:98,p:11,u:'g'}, minas:{t:'Minas frescal light',k:190,p:17,u:'g'},
 requeijao:{t:'Requeijão light',k:180,p:10,u:'g'}, mucarela:{t:'Muçarela light',k:250,p:25,u:'g'},
 iog_prot:{t:'Iogurte proteico',k:62,p:9.4,u:'g'}, whey:{t:'Whey protein',k:393,p:77,u:'g'},
 nude:{t:'Leite de aveia Nude',k:45,p:0.5,u:'ml'}, leite_po:{t:'Leite em pó semidesnatado',k:420,p:33,u:'g'},
 bebida_prot:{t:'Bebida láctea proteica UHT',k:56,p:6,u:'ml'}, barra:{t:'Barra proteica',k:190,p:15,u:'un'},
 acai:{t:'Polpa de açaí pura',k:60,p:0.8,u:'g'}, banana:{t:'Banana prata',k:98,p:1.3,u:'g'},
 mamao:{t:'Mamão papaya',k:40,p:0.5,u:'g'}, morango:{t:'Morango',k:30,p:0.9,u:'g'}, maca:{t:'Maçã',k:56,p:0.3,u:'g'},
 kiwi:{t:'Kiwi',k:51,p:1.1,u:'g'}, melancia:{t:'Melancia',k:33,p:0.9,u:'g'}, melao:{t:'Melão',k:29,p:0.7,u:'g'},
 abacaxi:{t:'Abacaxi',k:48,p:0.9,u:'g'}, tangerina:{t:'Tangerina',k:38,p:0.8,u:'g'},
 castanha:{t:'Castanha-do-pará',k:26,p:0.6,u:'un'}, pasta_amend:{t:'Pasta de amendoim',k:600,p:25,u:'g'},
 arroz:{t:'Arroz cozido',k:128,p:2.5,u:'g'}, feijao:{t:'Feijão cozido',k:76,p:4.8,u:'g'},
 batata_doce:{t:'Batata-doce cozida',k:77,p:0.6,u:'g'}, batata:{t:'Batata inglesa cozida',k:52,p:1.2,u:'g'},
 mandioquinha:{t:'Mandioquinha cozida',k:80,p:0.9,u:'g'}, mandioca:{t:'Mandioca cozida',k:125,p:0.6,u:'g'},
 quinoa:{t:'Quinoa cozida',k:120,p:4.4,u:'g'}, macarrao:{t:'Macarrão integral cozido',k:124,p:5,u:'g'},
 cuscuz:{t:'Cuscuz pronto',k:113,p:2.2,u:'g'},
 legumes:{t:'Legumes cozidos',k:30,p:1.5,u:'g'}, abobora:{t:'Abóbora cabotiá',k:48,p:1.4,u:'g'},
 folhas:{t:'Folhas (salada)',k:15,p:1.3,u:'g'}, azeite:{t:'Azeite',k:810,p:0,u:'ml'},
 frango:{t:'Peito de frango grelhado',k:159,p:32,u:'g'}, patinho:{t:'Patinho (bife ou moído)',k:219,p:35.9,u:'g'},
 alcatra:{t:'Alcatra ou contrafilé limpo',k:234,p:32,u:'g'}, coxa:{t:'Coxa/sobrecoxa sem pele',k:167,p:26.9,u:'g'},
 tilapia:{t:'Tilápia grelhada',k:128,p:26,u:'g'}, linguado:{t:'Linguado grelhado',k:107,p:23.5,u:'g'},
 salmao:{t:'Salmão grelhado',k:229,p:23.9,u:'g'}, atum:{t:'Atum em água',k:117,p:26,u:'g'}
};
const FD_GROUPS = [
 ['Proteínas',['frango','patinho','alcatra','coxa','tilapia','linguado','salmao','atum','ovo','clara','whey','iog_prot','bebida_prot','barra','cottage','minas','requeijao','mucarela']],
 ['Carboidratos',['arroz','feijao','batata_doce','batata','mandioquinha','mandioca','quinoa','macarrao','cuscuz','flocao','pao_int','pao_fr','goma','aveia','wrap','torrada']],
 ['Frutas',['banana','mamao','morango','maca','kiwi','melancia','melao','abacaxi','tangerina','acai']],
 ['Legumes e outros',['legumes','abobora','folhas','azeite','castanha','pasta_amend','nude','leite_po']]
];
const defQty = f => FD[f].u==='un' ? 1 : (FD[f].u==='ml' ? 200 : 100);
function itemsVal(items){ let k=0,p=0; (items||[]).forEach(([f,q])=>{ const d=FD[f]; if(!d) return; const m = d.u==='un' ? (+q||0) : (+q||0)/100; k+=d.k*m; p+=d.p*m; }); return {k:Math.round(k), p:Math.round(p)}; }
function qtyTxt(f,q){ const d=FD[f]; return d.u==='un' ? `${q} un` : `${q} ${d.u}`; }

const r5 = x => Math.max(5, Math.round(x/5)*5);
function plateItems(id, c){
  const m = M[id]; const pr = PROT[c.pr] || PROT[0]; const cf = CARBS[c.cb] || CARBS[0];
  const fjK = FD.feijao.k*m.fjG/100;
  const target = c.fj===2 ? m.carbT + fjK : m.carbT;
  const items = [[cf, r5(target/FD[cf].k*100)]];
  if(!c.fj) items.push(['feijao', m.fjG]);
  items.push(['legumes', m.leg], ['folhas', 50]);
  if(!pr.noOil) items.push(['azeite', m.oil]);
  return items.concat(pr.it.map(x=>[...x]));
}
function normChoice(id, ch){
  const m = M[id];
  if(ch==null) return m.plate ? {mode:'plate',pr:0,cb:0,fj:0} : {mode:'opt',i:0};
  if(typeof ch==='number') return {mode:'opt', i:ch};
  if(!ch.mode) return {mode:'plate', pr:ch.pr||0, cb:Math.min(ch.cb||0, CARBS.length-1), fj:0};
  return ch;
}
function mealItems(id, ch){
  const c = normChoice(id, ch);
  if(c.mode==='custom') return c.items||[];
  if(c.mode==='plate') return plateItems(id, c);
  const o = M[id].opts[c.i] || M[id].opts[0]; return o.it;
}
function mealVal(id, ch){ return itemsVal(mealItems(id, ch)); }

function itemsList(items, editable, id){
  if(!items.length) return `<div class="small muted">Nenhum alimento ainda. Adicione abaixo.</div>`;
  return `<div class="items">${items.map(([f,q],i)=>{ const d=FD[f]; const v=itemsVal([[f,q]]);
    return `<div class="it"><span class="nm">${esc(d.t)}</span>${editable
      ? `<span class="qin"><input type="number" inputmode="decimal" min="0" step="${d.u==='un'?1:5}" value="${q}" data-qty="${id}" data-i="${i}" aria-label="Quantidade de ${esc(d.t)}"><span class="u">${d.u}</span></span><span class="kc num">${v.k}</span><button class="rm" data-rm="${id}" data-i="${i}" aria-label="Remover ${esc(d.t)}">×</button>`
      : `<span class="q num">${qtyTxt(f,q)}</span><span class="kc num">${v.k} kcal</span>`}</div>`; }).join('')}</div>`;
}
function foodSelect(id){
  return `<select data-add="${id}" aria-label="Adicionar alimento"><option value="">+ Adicionar alimento…</option>${FD_GROUPS.map(([g,ids])=>`<optgroup label="${g}">${ids.map(f=>`<option value="${f}">${esc(FD[f].t)}</option>`).join('')}</optgroup>`).join('')}</select>`;
}

function summarize(iso){
  const d = store.get('d:'+iso, null); if(!d) return null;
  const type = d.type || 'casa'; const plan = PLAN[type];
  let k=0,p=0,pk=0,done=0,fj=false;
  plan.forEach(([id])=>{ const v=mealVal(id,d.choice[id]); pk+=v.k; if(d.done&&d.done[id]){ k+=v.k; p+=v.p; done++; if(hasFeijao(id,d.choice[id])) fj=true; } });
  const sets={}; Object.entries(d.sets||{}).forEach(([key,a])=>{ const n=(a||[]).filter(Boolean).length; if(n) sets[key[0]]=(sets[key[0]]||0)+n; });
  const a = d.act||{}; const setsN = Object.values(sets).reduce((x,y)=>x+y,0);
  const any = done>0 || (d.water||0)>0 || setsN>0 || Object.values(a).some(v=>v!==null&&v!=='');
  return {iso, type, k, p, pk, done, total:plan.length, water:(d.water||0)*250, sets, setsN, treino:Object.keys(sets).join('+'),
    ct:a.ct||'', cm:+a.cm||0, ps:+a.ps||0, sn:+a.sn||0, pe:+a.pe||0, ci:+a.ci||0, es:a.es??'', fo:a.fo??'', nt:a.nt||'', fj, any};
}

function barChart(id, rows, key, target, unit, cls){
  const W=340, H=150, pl=4, pr=4, pt=14, pb=20; const n=rows.length; const vals=rows.map(r=>r&&r[key]?r[key]:0);
  const max = Math.max(target*1.25, ...vals, 1); const bw=(W-pl-pr)/n; const y=v=>pt+(H-pt-pb)*(1-v/max);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Gráfico por dia">`;
  s += `<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" class="axis"/>`;
  rows.forEach((r,i)=>{ const v=vals[i]; const x=pl+i*bw+bw*0.18, w=bw*0.64;
    if(v>0){ const yy=y(v), hh=H-pb-yy; s += `<path class="b ${cls}" d="M${x},${H-pb} V${yy+Math.min(3,hh)} q0,-3 3,-3 h${Math.max(0,w-6)} q3,0 3,3 V${H-pb} Z"/>`; }
    s += `<rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt}" data-tip="${id}" data-txt="${esc(r.lbl+': '+(v?fmtN(v)+' '+unit:'sem registro'))}"/>`;
    if(n<=14 || i%3===0 || i===n-1) s += `<text x="${pl+i*bw+bw/2}" y="${H-6}" class="tk" text-anchor="middle">${r.short}</text>`;
  });
  s += `<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" class="tgt"/><text x="${W-pr}" y="${y(target)-4}" class="tk" text-anchor="end">meta ${fmtN(target)}</text>`;
  return s + `</svg><div class="tip small muted" id="tip-${id}">Toque numa barra para ver o valor.</div>`;
}
function lineChart(id, rows, key, unit){
  const pts = rows.map((r,i)=>[i, r&&r[key]?r[key]:null, r]).filter(x=>x[1]);
  if(pts.length<2) return `<div class="small muted">Registre pelo menos 2 dias para ver a linha${pts.length===1?` (último: ${f1(pts[0][1])} ${unit})`:''}.</div>`;
  const W=340,H=140,pl=34,pr=10,pt=12,pb=20, n=rows.length; const vs=pts.map(p=>p[1]);
  let lo=Math.min(...vs), hi=Math.max(...vs); const pad=Math.max(0.5,(hi-lo)*0.25); lo-=pad; hi+=pad;
  const X=i=>pl+(W-pl-pr)*(n===1?0.5:i/(n-1)), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Linha por dia">`;
  [lo+pad, hi-pad].forEach(v=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${pl-4}" y="${Y(v)+4}" class="tk" text-anchor="end">${f1(v)}</text>`; });
  s += `<polyline class="ln" points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
  pts.forEach((p,j)=>{ s+=`<circle class="dot ${j===pts.length-1?'last':''}" cx="${X(p[0])}" cy="${Y(p[1])}" r="${j===pts.length-1?5:4}"/><circle class="hit" cx="${X(p[0])}" cy="${Y(p[1])}" r="14" data-tip="${id}" data-txt="${esc(p[2].lbl+': '+f1(p[1])+' '+unit)}"/>`; });
  s += `<text x="${pl}" y="${H-6}" class="tk">${rows[0].short}</text><text x="${W-pr}" y="${H-6}" class="tk" text-anchor="end">${rows[n-1].short}</text>`;
  return s+`</svg><div class="tip small muted" id="tip-${id}">Toque num ponto para ver o valor.</div>`;
}
function tile(label, val, sub, state){ return `<div class="tile ${state||''}"><div class="small muted">${label}</div><div class="tv num">${val}</div><div class="small">${sub}</div></div>`; }

function renderAnalise(){
  const rows=[]; for(let i=range-1;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); const iso=isoOf(d);
    const s = summarize(iso) || {iso, any:false}; s.lbl = DOW[d.getDay()]+' '+d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); s.short = String(d.getDate()); rows.push(s); }
  const reg = rows.filter(r=>r.any); const meals = rows.filter(r=>r.done>0);
  const last7 = rows.slice(-7), prev7 = rows.slice(-14,-7);
  let h = `<div class="card"><div class="row between wrap"><h2>Análise</h2><div class="seg3" role="group" aria-label="Período">${[7,14,30].map(n=>`<button data-range="${n}" aria-pressed="${n===range}">${n} dias</button>`).join('')}</div></div>
    <div class="small muted">${reg.length} de ${range} dias com algum registro. Calorias e proteína contam só as refeições marcadas como feitas.</div></div>`;
  if(!reg.length){
    h += `<div class="card"><h3>Ainda sem dados neste período</h3><ul class="clean small"><li>Na aba <b>Hoje</b>, marque as refeições como feitas, os copos de água e preencha atividades, peso e cintura.</li><li>Na aba <b>Treino</b>, toque nas séries concluídas.</li><li>Depois de 3–4 dias, esta tela mostra médias, gráficos e o que ajustar.</li></ul></div>`;
    h += backupCard(); main.innerHTML=h; bindAnalise(); return;
  }
  const aK=avg(meals.map(r=>r.k)), aP=avg(meals.map(r=>r.p)), wDays=rows.filter(r=>r.water>0), aW=avg(wDays.map(r=>r.water));
  const tr7=last7.filter(r=>r.setsN>=5).length, cd7=last7.filter(r=>r.cm>0), cm7=cd7.reduce((x,r)=>x+r.cm,0);
  const psD=rows.filter(r=>r.ps>0), aPs=avg(psD.map(r=>r.ps));
  const adh = meals.length ? Math.round(rows.reduce((x,r)=>x+(r.done||0),0)/rows.filter(r=>r.any).reduce((x,r)=>x+(r.total||0),0)*100) : 0;
  h += `<div class="tiles">
    ${tile('Calorias/dia', aK?fmtN(aK):'—', aK?(aK<1300?'abaixo do mínimo':aK>1520?'acima da meta':'dentro da meta'):'sem refeições', aK?(aK<1300||aK>1520?'warn':'good'):'')}
    ${tile('Proteína/dia', aP?fmtN(aP)+' g':'—', 'meta 120–130 g', aP?(aP<110?'warn':'good'):'')}
    ${tile('Água/dia', aW?f1(aW/1000)+' L':'—', 'meta 2,2–2,5 L', aW?(aW<2000?'warn':'good'):'')}
    ${tile('Treinos (7 dias)', tr7+' de 4', 'dias com 5+ séries', tr7>=4?'good':tr7>=3?'':'warn')}
    ${tile('Cardio (7 dias)', cd7.length+' de 3', fmtN(cm7)+' min no total', cd7.length>=3?'good':cd7.length>=2?'':'warn')}
    ${tile('Adesão', adh+'%', 'refeições marcadas', adh>=85?'good':adh>=70?'':'warn')}
  </div>`;
  h += `<div class="card"><h3>Insights</h3><ul class="clean small">${insights(rows,last7,prev7,{aK,aP,aW,aPs,tr7,cd7}).map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  h += `<div class="card"><h3>Calorias por dia</h3>${barChart('k',rows,'k',1420,'kcal','food')}</div>`;
  h += `<div class="card"><h3>Proteína por dia (g)</h3>${barChart('p',rows,'p',120,'g','acc')}</div>`;
  h += `<div class="card"><h3>Água por dia (ml)</h3>${barChart('w',rows,'water',2500,'ml','acc')}</div>`;
  h += `<div class="card"><h3>Peso em jejum (kg)</h3>${lineChart('pe',rows,'pe','kg')}</div>`;
  h += `<div class="card"><h3>Cintura (cm)</h3>${lineChart('ci',rows,'ci','cm')}</div>`;
  h += `<div class="card"><h3>Dia a dia</h3><div class="tw"><table class="tbl num"><thead><tr><th>Dia</th><th>kcal</th><th>Prot.</th><th>Água</th><th>Treino</th><th>Cardio</th><th>Peso</th></tr></thead><tbody>${rows.slice().reverse().filter(r=>r.any).map(r=>`<tr><td>${r.lbl}${r.type&&r.type!=='casa'?' <span class="muted">· plantão</span>':''}${r.nt?`<div class="small muted">${esc(r.nt)}</div>`:''}</td><td>${r.k?fmtN(r.k):'—'}</td><td>${r.p?r.p+' g':'—'}</td><td>${r.water?f1(r.water/1000)+' L':'—'}</td><td>${r.treino||'—'}</td><td>${r.cm?r.cm+'′':'—'}</td><td>${r.pe?f1(r.pe):'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
  h += backupCard();
  main.innerHTML = h; bindAnalise();
}
function insights(rows,last7,prev7,a){
  const out=[]; const meals=rows.filter(r=>r.done>0);
  if(a.aK){ if(a.aK<1300) out.push(`Média de <b>${fmtN(a.aK)} kcal</b>: abaixo do mínimo seguro de 1.300. Isso favorece perda de músculo e fome no plantão; suba as porções.`);
    else if(a.aK>1520) out.push(`Média de <b>${fmtN(a.aK)} kcal</b>: acima da meta de ≈ 1.420. Confira as refeições montadas do seu jeito e o azeite.`);
    else out.push(`Média de <b>${fmtN(a.aK)} kcal</b>: dentro da faixa do cutting.`); }
  const lowP = meals.filter(r=>r.p<110).length;
  if(a.aP && lowP) out.push(`Proteína abaixo de 110 g em <b>${lowP} de ${meals.length}</b> dias. Garanta a proteína do lanche (whey ou bebida proteica) nesses dias.`);
  else if(a.aP) out.push(`Proteína na meta em todos os dias registrados (média ${fmtN(a.aP)} g).`);
  const lowW = rows.filter(r=>r.water>0 && r.water<2000).length;
  if(lowW) out.push(`Água abaixo de 2 L em <b>${lowW}</b> dias. Pouca água piora retenção e força no treino.`);
  const plt = meals.filter(r=>r.type!=='casa'), cas = meals.filter(r=>r.type==='casa');
  if(plt.length && cas.length){ const pk=avg(plt.map(r=>r.k)), ck=avg(cas.map(r=>r.k)); out.push(`Dias de plantão: média de ${fmtN(pk)} kcal vs ${fmtN(ck)} kcal em casa.`); }
  if(a.tr7<4) out.push(`Treinos nos últimos 7 dias: <b>${a.tr7} de 4</b>. Encaixe o que faltou em um dia de folga do plantão.`);
  if(a.cd7.length<3) out.push(`Cardio nos últimos 7 dias: <b>${a.cd7.length} de 3</b> sessões.`);
  if(a.aPs) out.push(`Média de <b>${fmtN(a.aPs)} passos</b>${a.aPs<7000?': abaixo da meta de 7.000–8.000. 10 min de caminhada após almoço e jantar ajudam.':': dentro da meta.'}`);
  const sn = rows.filter(r=>r.sn>0 && r.type==='casa'); if(sn.length>=3){ const as=avg(sn.map(r=>r.sn)); if(as<7) out.push(`Sono médio de ${f1(as)} h nos dias sem plantão. Abaixo de 7 h a fome e a perda de força aumentam.`); }
  const es = rows.filter(r=>r.es==='1'||r.es==='2'); const esInfo = rows.filter(r=>r.es!==''&&r.es!=null);
  if(es.length && esInfo.length>=3){ const withF = es.filter(r=>r.fj).length; const noEs = esInfo.filter(r=>r.es==='0'); const noEsF = noEs.filter(r=>r.fj).length;
    out.push(`Barriga estufada em <b>${es.length}</b> dias; em ${withF} deles você comeu feijão${noEs.length?` (nos ${noEs.length} dias sem estufar, ${noEsF} tiveram feijão)`:''}. ${withF/es.length>0.7 && (!noEs.length || noEsF/noEs.length<0.5) ? 'O feijão parece pesar: teste a opção sem feijão por 1 semana.' : 'O feijão não parece ser a causa principal; olhe também whey, lactose e legumes.'}`); }
  const fome = rows.filter(r=>r.fo==='3'); if(fome.length>=2){ const pl=fome.filter(r=>r.type!=='casa').length; out.push(`Muita fome em ${fome.length} dias${pl?` (${pl} de plantão)`:''}. Puxe 20 g de arroz do jantar para o lanche da manhã nesses dias.`); }
  const w7=last7.filter(r=>r.pe>0).map(r=>r.pe), wp=prev7.filter(r=>r.pe>0).map(r=>r.pe);
  if(w7.length>=2 && wp.length>=2){ const d=avg(w7)-avg(wp);
    out.push(`Peso médio: ${f1(avg(w7))} kg nesta semana vs ${f1(avg(wp))} kg na anterior (${d>0?'+':''}${f1(d)} kg).`);
    if(d< -0.5) out.push('Perda acima de 0,5 kg/semana: suba 100–150 kcal para proteger o músculo.');
    else if(Math.abs(d)<0.1) out.push('Peso estável. Se a cintura também não cair por 3 semanas, tire 100 kcal ou some 2.000 passos/dia.'); }
  else out.push('Registre o peso em jejum 3× por semana para comparar médias semanais (a balança sozinha oscila muito).');
  const ci = rows.filter(r=>r.ci>0); if(ci.length>=2){ const d=ci[ci.length-1].ci-ci[0].ci; out.push(`Cintura: ${d>0?'+':''}${f1(d)} cm no período (${f1(ci[0].ci)} → ${f1(ci[ci.length-1].ci)} cm).`); }
  return out;
}
function backupCard(){
  return `<div class="card"><h3>Backup dos dados</h3><div class="small muted">Os registros ficam só neste navegador. Copie os dados de vez em quando e guarde, ou cole aqui para levar a outro celular.</div>
  <div class="row wrap"><button class="btn sm" id="bk-copy">Copiar meus dados</button><button class="btn sm" id="bk-show">Importar dados</button></div>
  <div id="bk-area" style="display:none" class="col"><textarea id="bk-txt" rows="5" aria-label="Dados para importar ou copiar" placeholder="Cole aqui os dados copiados"></textarea><button class="btn sm primary" id="bk-imp">Importar</button></div>
  <div class="small" id="bk-msg"></div></div>`;
}
function exportData(){ const o={}; allDayKeys().forEach(k=>o[k]=store.get(k,null)); try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&(k.startsWith('load:')||k.startsWith('sub:'))) o[k]=store.get(k,null); } }catch(e){} return JSON.stringify(o); }
function bindAnalise(){
  main.querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click',()=>{ range=+b.dataset.range; store.set('range',range); renderAnalise(); }));
  main.querySelectorAll('[data-tip]').forEach(el=>{ const f=()=>{ const t=document.getElementById('tip-'+el.dataset.tip); if(t){ t.textContent=el.dataset.txt; t.classList.remove('muted'); } }; el.addEventListener('click',f); el.addEventListener('mouseenter',f); });
  const msg=document.getElementById('bk-msg'), area=document.getElementById('bk-area'), txt=document.getElementById('bk-txt');
  document.getElementById('bk-copy').addEventListener('click',async()=>{ const data=exportData();
    try{ await navigator.clipboard.writeText(data); msg.textContent='Dados copiados. Cole numa nota ou mensagem para guardar.'; }
    catch(e){ area.style.display='flex'; txt.value=data; txt.select(); msg.textContent='Não deu para copiar automaticamente: o texto está selecionado acima, copie manualmente.'; } });
  document.getElementById('bk-show').addEventListener('click',()=>{ area.style.display='flex'; txt.value=''; txt.focus(); });
  document.getElementById('bk-imp').addEventListener('click',()=>{ try{ const o=JSON.parse(txt.value); let n=0; Object.entries(o).forEach(([k,v])=>{ if(/^(d|load|sub):/.test(k)){ store.set(k,v); n++; } }); msg.textContent=`${n} registros importados.`; renderAnalise(); }catch(e){ msg.textContent='Não reconheci esses dados. Cole exatamente o texto copiado em "Copiar meus dados".'; } });
}

/* ---------- cronômetro de descanso ---------- */
let tLeft=0, tInt=null, actx=null;
const tEl=document.getElementById('timer'), tVal=document.getElementById('tval');
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function beep(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; g.gain.value=0.15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.35); }catch(e){} try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} }
function startTimer(s){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){}
  tLeft=s; tEl.classList.add('show'); tEl.classList.remove('end'); tVal.textContent=fmt(tLeft);
  clearInterval(tInt); tInt=setInterval(()=>{ tLeft--; if(tLeft<=0){ tLeft=0; clearInterval(tInt); tEl.classList.add('end'); tVal.textContent='Vai!'; beep(); setTimeout(()=>tEl.classList.remove('show'),4000); return; } tVal.textContent=fmt(tLeft); },1000);
}
document.getElementById('tminus').addEventListener('click',()=>{ tLeft=Math.max(1,tLeft-15); tVal.textContent=fmt(tLeft); });
document.getElementById('tplus').addEventListener('click',()=>{ if(tLeft<=0) return startTimer(15); tLeft+=15; tVal.textContent=fmt(tLeft); });
document.getElementById('tstop').addEventListener('click',()=>{ clearInterval(tInt); tEl.classList.remove('show'); });

/* ---------- navegação ---------- */
const VIEWS = {hoje:renderHoje, refeicoes:renderRefeicoes, treino:renderTreino, cardio:renderCardio, analise:renderAnalise, dicas:renderDicas};
function route(){
  const t = (location.hash||'').slice(1); const v = VIEWS[t] ? t : 'hoje';
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current', a.dataset.tab===v ? 'page' : 'false'));
  VIEWS[v](); main.scrollTop=0;
}
function setDay(d){ day=d; store.set('dayType', d); const o=dayData(); if(o.type!==d){ o.type=d; saveDay(o); } document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.day===d)); route(); }
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setDay(b.dataset.day)));
window.addEventListener('hashchange', route);
setDay(dayData().type || day);
</script>
